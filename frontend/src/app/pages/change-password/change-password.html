<div class="change-password-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'auth.changePasswordTitle' | transloco }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.currentPassword' | transloco }}</mat-label>
          <input matInput type="password" formControlName="currentPassword">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.newPassword' | transloco }}</mat-label>
          <input matInput type="password" formControlName="newPassword">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'auth.confirmPassword' | transloco }}</mat-label>
          <input matInput type="password" formControlName="confirmPassword">
        </mat-form-field>

        <p class="error" *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched">
          {{ 'auth.passwordMismatch' | transloco }}
        </p>

        <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

        <button mat-flat-button type="submit" [disabled]="form.invalid">
          {{ 'auth.changePasswordButton' | transloco }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
