# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - hekutenantcoreapp

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Angular dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Angular
        run: npm run build
        working-directory: ./frontend

      - name: Copy Angular build to wwwroot
        # wwwroot is .gitignored; this rebuilt bundle is the single source of the deployed
        # frontend, picked up by `dotnet publish ./backend` below.
        run: |
          New-Item -ItemType Directory -Force -Path ./backend/Hekutenantcoreapp.Api/wwwroot
          Copy-Item -Recurse -Force ./frontend/dist/frontend/browser/* ./backend/Hekutenantcoreapp.Api/wwwroot/

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./backend --configuration Release

      - name: Test with dotnet
        run: dotnet test ./backend --configuration Release --no-build

      - name: dotnet publish
        run: dotnet publish ./backend/Hekutenantcoreapp.Api -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_43E3F1B9CDF343C98F603F9BF78AAE11 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8BC6DFF79B594AEDB9C617FE9F7F9EC2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8B8AA3D2D5764BC7AB3C2DD24486D3CF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hekutenantcoreapp'
          slot-name: 'Production'
          package: .
